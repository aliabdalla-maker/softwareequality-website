name: Production smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: softwareequality-production-smoke
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check DNS and HTTPS endpoints
        shell: bash
        run: |
          set -euo pipefail
          expected_ip=143.47.255.104

          apex_ip=$(dig +short softwareequality.com A | tail -1)
          www_ip=$(dig +short www.softwareequality.com A | tail -1)
          echo "softwareequality.com -> $apex_ip"
          echo "www.softwareequality.com -> $www_ip"
          test "$apex_ip" = "$expected_ip"
          test "$www_ip" = "$expected_ip"

          for url in \
            https://softwareequality.com/ \
            https://softwareequality.com/privacy \
            https://softwareequality.com/case-study-aepx \
            https://softwareequality.com/aep-x/ \
            https://softwareequality.com/api/health; do
            echo "checking $url"
            curl --fail --silent --show-error --location --max-time 15 "$url" >/tmp/body
            if [[ "$url" == */aep-x/ ]]; then
              grep -q 'AEP-X' /tmp/body
            fi
          done

      - name: Check redirects and security headers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI https://www.softwareequality.com/aep-x/ | grep -qi '^location: https://softwareequality.com/aep-x/'

          headers=$(curl -fsSI https://softwareequality.com/)
          printf '%s\n' "$headers"
          grep -qi '^strict-transport-security:' <<<"$headers"
          grep -qi '^x-content-type-options: nosniff' <<<"$headers"
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' <<<"$headers"

          code=$(curl -sS -o /dev/null -w '%{http_code}' https://softwareequality.com/does-not-exist)
          test "$code" = "404"
