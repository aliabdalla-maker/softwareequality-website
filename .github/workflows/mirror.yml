# One-off (re-runnable) import of the live softwareequality.com site from
# Netlify into this repo's site/ folder, then the files in overrides/ are laid
# on top (privacy pages for the Business AI Manager app). Run it from the
# Actions tab while the domain still points at Netlify. After the DNS switch
# the Oracle server serves site/ and this workflow is no longer needed:
# edit files in site/ directly and push.
name: Import site from Netlify

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Site to copy"
        default: "https://softwareequality.com"
        required: true

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every page and asset
        env:
          SRC: ${{ github.event.inputs.source }}
        run: |
          set -eu
          rm -rf mirror && mkdir mirror && cd mirror
          # Seed with the sitemap so unlinked pages are included too.
          curl -fsSL "$SRC/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' > urls.txt || true
          echo "$SRC/" >> urls.txt
          for f in robots.txt sitemap.xml favicon.png enterprise-ds.css research-stats.css enterprise.js agentic-assistant.js; do
            echo "$SRC/$f" >> urls.txt
          done
          host=$(echo "$SRC" | sed -E 's#https?://##; s#/.*##')
          wget --recursive --level=inf --page-requisites --adjust-extension \
               --no-parent --no-host-directories --domains="$host,www.$host" \
               -e robots=off --tries=3 --wait=0.2 --input-file=urls.txt \
               --reject-regex '/\.netlify/' || true
          # Custom 404 page: Netlify serves it for unknown paths.
          curl -s "$SRC/__page_that_does_not_exist__" -o 404.html || true
          rm -f urls.txt
          # wget saves ?v=3.6 asset URLs as e.g. "enterprise-ds.css?v=3.6"; keep the plain name.
          find . -name '*\?*' | while read -r f; do mv -f "$f" "${f%%\?*}"; done
          # Drop Netlify-only analytics script tags; they 404 anywhere else.
          find . -name '*.html' -exec sed -i -E 's#<script[^>]*/\.netlify/[^>]*></script>##g' {} +
          ls -la

      - name: Replace site/ and apply overrides
        run: |
          set -eu
          rm -rf site && mv mirror site
          cp -f overrides/* site/
          echo "Files: $(find site -type f | wc -l)"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --quiet && echo "No changes" || git commit -m "Import site from ${{ github.event.inputs.source }}"
          git push
